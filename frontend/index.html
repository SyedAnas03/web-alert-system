<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('wasTheme') || 'light');</script>
<title>Web Alert System — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20; vertical-align:middle; line-height:1;}</style>
</head>
<body>
  <button class="theme-toggle-auth" onclick="toggleTheme()" aria-label="Toggle dark mode"><span data-theme-icon>🌙</span></button>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-eyebrow">Dispatch Console</div>
      <h1>Web Alert System</h1>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required />
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Password" required />
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password', this)" aria-label="Show password">
            <span class="material-symbols-outlined" data-eye-icon>visibility</span>
          </button>
        </div>
        <p class="error" id="errorMsg"></p>
        <button type="submit">Log In</button>
      </form>
      <p class="muted"><a href="forgot-password.html">Forgot password?</a></p>
      <p class="muted">No account? <a href="register.html">Register here</a></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    initThemeIcon();
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.textContent = "";

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.message || "Login failed.";
          return;
        }

        saveSession(data.token, data.user);
        window.location.href = data.user.role === "admin" ? "dashboard.html" : "user.html";
      } catch (err) {
        errorMsg.textContent = "Could not reach the server. Is the backend running?";
      }
    });
  </script>
</body>
</html>
