<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('wasTheme') || 'light');</script>
<title>Dispatch Console — Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20; vertical-align:middle; line-height:1;}</style>
</head>
<body>
  <header class="console-header">
    <div class="brand">
      Web Alert System
      <span class="brand-tag">Dispatch Console</span>
    </div>
    <div class="header-right">
      <span class="user-chip">Welcome, <strong id="userName">Admin</strong><span class="role-tag" id="roleTag"></span></span>
      <div class="pulse-badge"><span class="pulse-dot"></span> <span id="onlineCount">0</span> online now</div>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode"><span data-theme-icon>🌙</span></button>
      <button class="ghost auto-width" onclick="handleLogout()">Log Out</button>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar">
      <div class="sidebar-label">Navigate</div>
      <nav id="sideNav">
        <a href="#compose" data-section="compose"><span class="material-symbols-outlined">edit_square</span> Compose</a>
        <a href="#analytics" data-section="analytics"><span class="material-symbols-outlined">bar_chart</span> Analytics</a>
        <a href="#log" data-section="log"><span class="material-symbols-outlined">history</span> Alert Log</a>
        <a href="users.html" id="usersNavLink" style="display:none;"><span class="material-symbols-outlined">group</span> Users</a>
      </nav>
    </aside>

    <main class="shell">
      <div class="shell-inner">
        <div class="stat-row">
          <div class="stat-card">
            <span class="material-symbols-outlined stat-icon">campaign</span>
            <div class="stat-label">Total Alerts Sent</div>
            <div class="stat-value" id="statTotal">—</div>
          </div>
          <div class="stat-card">
            <span class="material-symbols-outlined stat-icon">today</span>
            <div class="stat-label">Sent Today</div>
            <div class="stat-value" id="statToday">—</div>
          </div>
          <div class="stat-card">
            <span class="material-symbols-outlined stat-icon">group</span>
            <div class="stat-label">Users Online</div>
            <div class="stat-value" id="statOnline">0</div>
          </div>
        </div>

        <div class="grid-2">
          <div class="panel" id="compose">
            <h2><span class="material-symbols-outlined" style="font-size:18px;">edit_square</span> Compose Alert</h2>
            <select id="templatePicker">
              <option value="">— Load a template (optional) —</option>
              <option value="drill">Emergency Drill</option>
              <option value="exam">Exam Alert</option>
              <option value="maintenance">Maintenance Notice</option>
              <option value="meeting">Meeting Reminder</option>
              <option value="fee">Fee Reminder</option>
            </select>
            <form id="alertForm">
              <input type="text" id="title" placeholder="Alert Title" required />
              <textarea id="message" placeholder="Alert Message" required></textarea>
              <select id="category">
                <option value="General Announcement">General Announcement</option>
                <option value="System Update">System Update</option>
                <option value="Emergency" id="emergencyOption">Emergency</option>
              </select>
              <select id="priority">
                <option value="Low">Priority: Low</option>
                <option value="Medium" selected>Priority: Medium</option>
                <option value="High">Priority: High</option>
                <option value="Critical">Priority: Critical</option>
              </select>
              <input type="text" id="targetGroups" placeholder="Target groups, comma separated (default: general)" />
              <label class="checkbox-row"><input type="checkbox" id="sendEmail" /> Also send via email</label>
              <p class="error" id="errorMsg"></p>
              <button type="submit"><span class="material-symbols-outlined" style="font-size:16px;">send</span> Send Alert</button>
            </form>
          </div>

          <div class="panel" id="analytics">
            <h2><span class="material-symbols-outlined" style="font-size:18px;">bar_chart</span> Alerts — Last 7 Days</h2>
            <canvas id="alertChart" height="180"></canvas>
          </div>
        </div>

        <div class="panel" id="log">
          <h2><span class="material-symbols-outlined" style="font-size:18px;">history</span> Alert Log</h2>
          <div class="log-feed" id="alertList"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script>
    requireStaff();
    const me = getUser();
    document.getElementById("userName").textContent = me.name;
    document.getElementById("roleTag").textContent = me.role;
    initThemeIcon();

    if (me.role !== "admin") {
      document.getElementById("emergencyOption").remove();
    } else {
      document.getElementById("usersNavLink").style.display = "flex";
    }

    const templates = {
      drill: { title: "Emergency Drill Scheduled", message: "A routine emergency drill will take place today. Please follow staff instructions calmly.", category: "Emergency", priority: "High" },
      exam: { title: "Exam Schedule Alert", message: "Your upcoming exam schedule has been updated. Please check the portal for details.", category: "General Announcement", priority: "Medium" },
      maintenance: { title: "Scheduled Maintenance Notice", message: "The system/facility will be under maintenance during the announced window. Expect brief downtime.", category: "System Update", priority: "Medium" },
      meeting: { title: "Meeting Reminder", message: "This is a reminder for the upcoming meeting. Please arrive on time.", category: "General Announcement", priority: "Low" },
      fee: { title: "Fee Payment Reminder", message: "This is a reminder that fee payment is due soon. Please clear dues to avoid late charges.", category: "General Announcement", priority: "High" },
    };

    document.getElementById("templatePicker").addEventListener("change", (e) => {
      const t = templates[e.target.value];
      if (!t) return;
      document.getElementById("title").value = t.title;
      document.getElementById("message").value = t.message;
      if (t.category !== "Emergency" || me.role === "admin") {
        document.getElementById("category").value = t.category;
      }
      document.getElementById("priority").value = t.priority;
    });

    const socket = io(SOCKET_BASE);
    const alertList = document.getElementById("alertList");
    let chart;
    const priorityRank = { Critical: 0, High: 1, Medium: 2, Low: 3 };

    // Log Out is a deliberate action - disconnect immediately instead of waiting
    // for the server's connection timeout to notice the tab is gone.
    function handleLogout() {
      socket.disconnect();
      logout();
    }
    // Covers closing the tab/window or navigating away another way.
    window.addEventListener("beforeunload", () => socket.disconnect());

    function categoryClass(category) { return category.replace(/\s+/g, "-"); }

    function sortAlerts(alerts) {
      return [...alerts].sort((a, b) => {
        const pDiff = (priorityRank[a.priority] ?? 2) - (priorityRank[b.priority] ?? 2);
        if (pDiff !== 0) return pDiff;
        return new Date(b.createdAt) - new Date(a.createdAt);
      });
    }

    function renderAlert(alert) {
      const div = document.createElement("div");
      div.className = `log-entry ${categoryClass(alert.category)}`;
      div.dataset.id = alert._id;
      const readCount = (alert.readBy || []).length;
      const ackCount = (alert.acknowledgedBy || []).length;
      const ackLine = alert.category === "Emergency"
        ? ` · <span class="ack-count" data-id="${alert._id}">Acknowledged: ${ackCount}</span>`
        : "";
      const deleteBtn = me.role === "admin"
        ? `<button class="danger auto-width" style="margin-top:10px;" onclick="deleteAlert('${alert._id}')">Delete</button>`
        : "";
      div.innerHTML = `
        <div class="log-top">
          <span class="category-tag ${categoryClass(alert.category)}">${alert.category}</span>
          <span class="priority-tag ${alert.priority || "Medium"}">${alert.priority || "Medium"}</span>
        </div>
        <h3>${alert.title}</h3>
        <p>${alert.message}</p>
        <div class="log-meta">groups: ${alert.targetGroups.join(", ")} · ${new Date(alert.createdAt).toLocaleString()} · Read by <span class="read-count" data-id="${alert._id}">${readCount}</span>${ackLine}</div>
        ${deleteBtn}
      `;
      return div;
    }

    async function loadAlerts() {
      const res = await fetch(`${API_BASE}/alerts`, { headers: { Authorization: `Bearer ${getToken()}` } });
      const alerts = sortAlerts(await res.json());
      alertList.innerHTML = "";
      if (alerts.length === 0) {
        alertList.innerHTML = `<div class="empty-state">No alerts sent yet — the log fills in here.</div>`;
        return;
      }
      alerts.forEach((a) => alertList.appendChild(renderAlert(a)));
    }

    async function loadStats() {
      const res = await fetch(`${API_BASE}/alerts/stats`, { headers: { Authorization: `Bearer ${getToken()}` } });
      const stats = await res.json();
      document.getElementById("statTotal").textContent = stats.total;
      document.getElementById("statToday").textContent = stats.todayCount;
      renderChart(stats.last7Days);
    }

    function renderChart(last7Days) {
      const labels = last7Days.map((d) => d.date.slice(5));
      const counts = last7Days.map((d) => d.count);
      const ctx = document.getElementById("alertChart").getContext("2d");
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: "bar",
        data: { labels, datasets: [{ label: "Alerts sent", data: counts, backgroundColor: "#FFB100", borderRadius: 4, maxBarThickness: 28 }] },
        options: {
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } }, x: { grid: { display: false } } },
        },
      });
    }

    async function deleteAlert(id) {
      if (!confirm("Delete this alert?")) return;
      await fetch(`${API_BASE}/alerts/${id}`, { method: "DELETE", headers: { Authorization: `Bearer ${getToken()}` } });
    }

    document.getElementById("alertForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.textContent = "";

      const title = document.getElementById("title").value;
      const message = document.getElementById("message").value;
      const category = document.getElementById("category").value;
      const priority = document.getElementById("priority").value;
      const groupsRaw = document.getElementById("targetGroups").value;
      const targetGroups = groupsRaw ? groupsRaw.split(",").map((g) => g.trim()) : ["general"];
      const sendEmailFlag = document.getElementById("sendEmail").checked;

      const res = await fetch(`${API_BASE}/alerts`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${getToken()}` },
        body: JSON.stringify({ title, message, category, priority, targetGroups, sendEmail: sendEmailFlag }),
      });
      const data = await res.json();

      if (!res.ok) {
        errorMsg.textContent = data.message || "Could not create alert.";
        return;
      }
      e.target.reset();
      document.getElementById("templatePicker").value = "";
    });

    socket.on("newAlert", () => { loadAlerts(); loadStats(); });
    socket.on("alertDeleted", () => { loadAlerts(); loadStats(); });
    socket.on("onlineCount", (count) => {
      document.getElementById("onlineCount").textContent = count;
      document.getElementById("statOnline").textContent = count;
    });
    socket.on("alertAcknowledged", ({ alertId, count }) => {
      const el = alertList.querySelector(`.ack-count[data-id="${alertId}"]`);
      if (el) el.textContent = `Acknowledged: ${count}`;
    });

    loadAlerts();
    loadStats();

    // --- Sidebar active-section highlighting ---
    const navLinks = document.querySelectorAll("#sideNav a");
    const sections = ["compose", "analytics", "log"].map((id) => document.getElementById(id));
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            navLinks.forEach((l) => l.classList.toggle("active", l.dataset.section === entry.target.id));
          }
        });
      },
      { rootMargin: "-40% 0px -50% 0px" }
    );
    sections.forEach((s) => s && observer.observe(s));
  </script>
</body>
</html>
