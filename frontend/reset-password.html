<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('wasTheme') || 'light');</script>
<title>Set New Password — Web Alert System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20; vertical-align:middle; line-height:1;}</style>
</head>
<body>
  <button class="theme-toggle-auth" onclick="toggleTheme()" aria-label="Toggle dark mode"><span data-theme-icon>🌙</span></button>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-eyebrow">Dispatch Console</div>
      <h1>Set New Password</h1>
      <form id="resetForm">
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="New password" required />
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password', this)" aria-label="Show password">
            <span class="material-symbols-outlined" data-eye-icon>visibility</span>
          </button>
        </div>
        <div class="password-wrapper">
          <input type="password" id="confirmPassword" placeholder="Confirm new password" required />
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirmPassword', this)" aria-label="Show password">
            <span class="material-symbols-outlined" data-eye-icon>visibility</span>
          </button>
        </div>
        <p class="subs-hint" style="margin-top:-8px; margin-bottom:14px;">At least 10 characters, with an uppercase letter, a lowercase letter, a number, and a special character.</p>
        <p class="error" id="errorMsg"></p>
        <button type="submit">Update Password</button>
      </form>
      <p class="muted"><a href="index.html">Back to login</a></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    initThemeIcon();
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const errorMsg = document.getElementById("errorMsg");

    if (!token) {
      errorMsg.textContent = "This reset link is missing its token. Please request a new one.";
    }

    const strongPasswordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{10,}$/;

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.textContent = "";

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        errorMsg.textContent = "Passwords don't match.";
        return;
      }
      if (!strongPasswordRegex.test(password)) {
        errorMsg.textContent = "Password must be at least 10 characters and include an uppercase letter, a lowercase letter, a number, and a special character.";
        return;
      }
      if (!token) {
        errorMsg.textContent = "This reset link is missing its token. Please request a new one.";
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/auth/reset-password/${token}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.message || "Could not reset password.";
          return;
        }

        alert("Password updated. Redirecting to login...");
        window.location.href = "index.html";
      } catch (err) {
        errorMsg.textContent = "Could not reach the server. Is the backend running?";
      }
    });
  </script>
</body>
</html>
