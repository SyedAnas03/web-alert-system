<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('wasTheme') || 'light');</script>
<title>Reset Password — Web Alert System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <button class="theme-toggle-auth" onclick="toggleTheme()" aria-label="Toggle dark mode"><span data-theme-icon>🌙</span></button>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-eyebrow">Dispatch Console</div>
      <h1>Forgot Password</h1>
      <form id="forgotForm">
        <input type="email" id="email" placeholder="Your account email" required />
        <p class="error" id="errorMsg"></p>
        <p class="muted" id="successMsg" style="color:var(--general); display:none;"></p>
        <button type="submit">Send Reset Link</button>
      </form>
      <p class="muted"><a href="index.html">Back to login</a></p>
      <p class="muted">Note: this requires the backend's Gmail settings to be configured. If email isn't set up yet, ask your admin to reset your password directly from the Users panel instead.</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    initThemeIcon();
    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const errorMsg = document.getElementById("errorMsg");
      const successMsg = document.getElementById("successMsg");
      errorMsg.textContent = "";
      successMsg.style.display = "none";

      try {
        const res = await fetch(`${API_BASE}/auth/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.message || "Something went wrong.";
          return;
        }

        successMsg.textContent = data.message;
        successMsg.style.display = "block";
        e.target.reset();
      } catch (err) {
        errorMsg.textContent = "Could not reach the server. Is the backend running?";
      }
    });
  </script>
</body>
</html>
